name: C Pipeline (CI/CD)

on:
  push:
    branches: [ main ]

jobs:
  # Job 1: CI — the program must compile cleanly and run without crashing
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Compile (warnings count as errors)
        run: gcc -Wall -Wextra -Werror test.c -o test

      - name: Run program
        run: ./test

  # Job 2: CD — runs ONLY if "test" passed
  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/test:latest
